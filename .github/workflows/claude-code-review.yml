name: Claude Code Review

# Posts one severity-ranked, validated terminal review on every PR — a
# SINGLE-PASS, high-recall design.
#
# WHY (2026-07-01 rewrite): this workflow previously ran the official
# `code-review` PLUGIN on Sonnet 4.6. That plugin is precision-gated
# ("we only want HIGH SIGNAL issues" + a validation/filter pass that deletes
# anything not compile-breaking), so on iterated PRs it posted only a terse
# "No issues found." while fanning out ~10 subagents per run (x5 pushes/PR) —
# high token/rate-limit burn, near-zero surfaced value. This reverts to the
# hardened single-pass direct review pattern (mirrored from TracklyMac
# #239, itself revived from an earlier direct-review design) that produced
# valuable P1/P2/P3 feedback before the plugin migration, upgraded to
# Sonnet 5, and keeps the jimmy->berkeley token failover.
#
# Auth: Claude Max-plan subscription via CLAUDE_CODE_OAUTH_TOKEN (+ _FALLBACK),
#   stored as repository secrets for this workflow.
#   ANTHROPIC_API_KEY nulled so the token wins.
# Model: Opus 4.8 (claude-opus-4-8) primary with a Sonnet 5 (claude-sonnet-5)
#   fallback, so an overloaded/unavailable Opus still posts a review. The pair
#   is set once via the CLAUDE_REVIEW_MODEL / CLAUDE_REVIEW_FALLBACK_MODEL job
#   env knobs (Kevin's choice 2026-07-16 — the May Opus quality bar).
# Action pin (v3, 2026-07-16): bumped to v1.0.176. v1.0.162 MASKED a turn-1 SDK
#   failure (`is_error:true` under a `success` subtype) as step SUCCESS, so the
#   jimmy->berkeley failover never fired and reviews went silently empty since
#   July 1. v1.0.172 fails the step on is_error:true (failover works again);
#   v1.0.176 is current.
# Identity: posts as github-actions[bot] (github_token is passed, which bypasses
#   the Claude App-token exchange). The comment body is branded so it is clearly
#   Claude's review. Restoring the "Claude" avatar would require dropping
#   github_token (unvalidated; the App may lack the needed PR-comment scopes) —
#   intentionally not done.
# Security: the diff is precomputed in a trusted step and injected INLINE into
#   the prompt. Claude gets no tools. Large diffs are capped honestly as PARTIAL
#   coverage instead of being persisted for model reads. A base-branch extractor
#   validates the terminal grammar and rendered-content policy before the job's
#   own token posts the canonical review through GitHub's REST API.
# Hardened (/ce-code-review pass): no-SIGPIPE diff truncation, randomized
#   GITHUB_ENV delimiter, has_diff gate + empty-diff guard, precompute
#   continue-on-error, and a visible PR notice when review can't run (so a
#   green check is never mistaken for "reviewed clean").
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Default-base + fork guard + draft skip: the trusted extractor comes from
    # the PR base SHA, so only the protected default branch may supply it.
    # Repository secrets are unavailable to fork code, and drafts skip quota.
    # trackly-cli is PUBLIC — gate to trusted PR authors (association) AND
    # same-repo head. Do NOT hardcode a personal login (stale kevinastuhuaman gate removed).
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR')
    # 90 min: primary(40) + fallback(40) each budgeted; the job cap must exceed
    # both plus checkout/precompute so a hung primary still leaves the fallback
    # its full window to post.
    timeout-minutes: 90
    # Quota fallback (PR #119, until ~Sep 1 2026): same-repo PRs route via repo
    # var CI_RUNNER_LINUX (unset = exactly ubuntu-latest); fork PRs never reach
    # the shared bridge (public repo). PR-only trigger, so no push-event term.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    env:
      API_FORCE_IDLE_TIMEOUT: "1"
      # Model pair (Kevin's choice 2026-07-16): Opus 4.8 primary, Sonnet 5
      # fallback — the May-quality bar. Both review steps reference these so the
      # pair is changed in exactly one place.
      CLAUDE_REVIEW_MODEL: claude-opus-4-8
      CLAUDE_REVIEW_FALLBACK_MODEL: claude-sonnet-5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # REQUIRED even with claude_code_oauth_token: the action fetches a GitHub
      # OIDC token during setup. Posting still uses the job's github_token.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # PR HEAD sha (not the synthetic merge commit) so the review input
          # and exact-run terminal record describe the same revision.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Skip the review when this PR edits the review workflow itself — a
      # workflow change can't be trusted/validated until it's on the default
      # branch, and this avoids running edited secret-bearing workflow code from
      # a PR head. --name-status -M so a RENAME of the workflow is caught.
      - name: Check Claude review workflow self-change
        id: review-workflow
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Fail-safe: if the base-ref fetch or merge-base can't be established,
          # treat the workflow as self-changed (skip) rather than risk an
          # incomplete changed-file list bypassing the self-change guard.
          if ! git fetch origin "$BASE_REF"; then
            echo "Failed to fetch origin/${BASE_REF}; treating workflow as self-changed (fail-safe skip)."
            CHANGED_FILES=".github/workflows/claude-code-review.yml"
          elif MERGE_BASE="$(git merge-base "origin/${BASE_REF}" HEAD 2>/dev/null)"; then
            CHANGED_FILES="$(git diff --name-status -M "$MERGE_BASE" HEAD | cut -f2- | tr '\t' '\n')"
          else
            echo "No merge base with origin/${BASE_REF}; treating workflow as self-changed (fail-safe skip)."
            CHANGED_FILES=".github/workflows/claude-code-review.yml"
          fi
          if printf '%s\n' "$CHANGED_FILES" | grep -Fxq '.github/workflows/claude-code-review.yml'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Claude review workflow changed in this PR; skipping until it is on the default branch."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR notice when Claude workflow self-changed
        if: steps.review-workflow.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN_POST: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "::warning title=Claude review skipped::This PR changes the Claude review workflow, so automated Claude review is skipped until the workflow lands on the default branch. Use compensating structured review before relying on this gate."
          BODY="## 🔵 Claude Code Review"$'\n\n'"⚠️ Automated review skipped because this PR changes the Claude review workflow at head \`${HEAD_SHA}\` ([run](${RUN_URL})). This required check is NOT an approval and NOT a clean review result. Use an exact-head compensating structured review before relying on this gate."
          python3 -c 'import json,sys;print(json.dumps({"body":sys.argv[1]}))' "$BODY" > "$RUNNER_TEMP/cr_self_change_notice.json"
          if curl -sS --fail -X POST \
              -H "Authorization: Bearer ${GH_TOKEN_POST}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -d @"$RUNNER_TEMP/cr_self_change_notice.json" >/dev/null; then
            echo "Posted self-change review-skip notice to PR."
          else
            echo "::error::Failed to post self-change review-skip notice to the PR."
            exit 1
          fi

      # Precompute the diff in a trusted step and inject it DIRECTLY into the
      # prompt (via GITHUB_ENV). Claude is then given no filesystem/shell tools,
      # so prompt-injected PR content cannot read other runner state. The diff
      # is data in the prompt, not a file Claude must fetch. Output is capped
      # to bound the prompt.
      - name: Precompute PR diff
        id: precompute
        # continue-on-error lets the status and notice steps explain a diff-compute
        # failure before the final verdict fails closed. (Reliability.)
        continue-on-error: true
        if: steps.review-workflow.outputs.changed != 'true'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          # Fetch the base HERE (not only in the self-change step) so BASE
          # resolves regardless of step ordering / checkout refspec. (Correctness.)
          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          BASE="origin/${BASE_REF}"
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || BASE="$BASE_SHA"
          FILES="$(git diff --name-only "${BASE}...HEAD" || true)"
          # Write the diff to a FILE (not a shell var) so a pathologically large
          # PR can't exhaust runner memory, then read back only the capped
          # prefix. Using `head -c` on a FILE also avoids the pipe-SIGPIPE
          # that fails `git diff | head -c` under pipefail on >cap PRs.
          # (CodeRabbit L140 + Correctness P1.)
          # 100 KB cap: the whole prompt (template + diff) travels as ONE env
          # string, and Linux MAX_ARG_STRLEN caps a single env string at ~128 KB.
          # 200 KB broke the action on large-diff PRs ("Argument list too long").
          # (Codex L134.)
          MAXLEN=100000
          DIFF_FILE="${RUNNER_TEMP:-/tmp}/claude-review.diff"
          git diff -U3 "${BASE}...HEAD" > "$DIFF_FILE" 2>/dev/null || true
          BYTES="$(wc -c < "$DIFF_FILE" | tr -d ' ')"
          # Empty diff for real changes => don't let the model post a false LGTM.
          if [ "${BYTES:-0}" -eq 0 ]; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No diff::Empty diff (files: ${FILES:-none}); skipping review to avoid a false LGTM."
            exit 0
          fi
          # Trusted changed-line map: every finding locator the model emits must
          # name a changed path and a line inside one of these hunks, so a
          # misstated or hallucinated location cannot become part of the
          # validated exact-run record. The map is built from the exact diff
          # bytes the model sees (the capped prefix when coverage is PARTIAL),
          # and the inline builder below is byte-for-byte the checked-in
          # scripts/build-changed-lines-map.py so it can be unit-tested; the
          # copy lives here so a PR cannot swap the builder without tripping the
          # workflow self-change guard. (Codex P2 on PR #136.)
          VISIBLE_DIFF_FILE="${RUNNER_TEMP:-/tmp}/claude-review-visible.diff"
          if [ "$BYTES" -gt "$MAXLEN" ]; then
            head -c "$MAXLEN" "$DIFF_FILE" > "$VISIBLE_DIFF_FILE"
          else
            cp "$DIFF_FILE" "$VISIBLE_DIFF_FILE"
          fi
          CHANGED_LINES_FILE="${RUNNER_TEMP:-/tmp}/claude-review-changed-lines.json"
          if ! python3 - "$VISIBLE_DIFF_FILE" "$CHANGED_LINES_FILE" <<'PY'
          #!/usr/bin/env python3
          """Build the trusted changed-line map for the Claude review gate.

          Reads a unified diff and writes a JSON object keyed by path whose values are
          [start, end] line ranges. Right-side (new file) hunk ranges are recorded under
          the new path and left-side (old file) hunk ranges under the old path, so a
          finding may cite either an added/changed line or a deleted line. File headers
          are honored only between a `diff --git` line and the first hunk, so an added
          content line rendered as `+++ ...` can never forge a changed path.
          """
          import json
          import re
          import sys

          HUNK = re.compile(r'^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@')


          ESCAPES = {'a': 7, 'b': 8, 't': 9, 'n': 10, 'v': 11, 'f': 12, 'r': 13, '"': 34, '\\': 92}


          def unquote_git_path(target):
              """Decode a git C-style quoted path (core.quotePath) into its plain form."""
              if len(target) < 2 or not (target.startswith('"') and target.endswith('"')):
                  return target
              raw = bytearray()
              body = target[1:-1]
              index = 0
              while index < len(body):
                  character = body[index]
                  if character != '\\':
                      raw.extend(character.encode('utf-8'))
                      index += 1
                      continue
                  index += 1
                  if index >= len(body):
                      raise ValueError('unterminated escape in quoted diff path')
                  escape = body[index]
                  octal = re.match(r'[0-7]{3}', body[index:index + 3])
                  if octal:
                      raw.append(int(octal.group(0), 8))
                      index += 3
                  elif escape in ESCAPES:
                      raw.append(ESCAPES[escape])
                      index += 1
                  else:
                      raise ValueError('unknown escape in quoted diff path')
              return raw.decode('utf-8', errors='replace')


          def header_path(line, prefix):
              target = line[4:].rstrip('\n').rstrip('\t')
              if target == '/dev/null':
                  return None
              return re.sub('^' + re.escape(prefix), '', unquote_git_path(target), count=1)


          def hunk_range(start, count):
              start = int(start)
              count = 1 if count is None else int(count)
              return [start, start + count - 1] if count > 0 else None


          def clamp(entry, seen):
              """Shrink a recorded range to the lines actually present in the diff."""
              if entry is None:
                  return
              ranges, span = entry
              if seen <= 0:
                  ranges[:] = [candidate for candidate in ranges if candidate is not span]
              else:
                  span[1] = min(span[1], span[0] + seen - 1)


          def flush(pending_left, pending_right, seen_left, seen_right):
              """Clamp the pending hunk on both sides; a shared span is clamped once."""
              if pending_right is pending_left:
                  clamp(pending_left, max(seen_left, seen_right))
              else:
                  clamp(pending_left, seen_left)
                  clamp(pending_right, seen_right)


          def build_changed_lines(lines):
              changed = {}
              in_header = False
              old_path = None
              new_path = None
              pending_left = None
              pending_right = None
              seen_left = 0
              seen_right = 0
              for line in lines:
                  if line.startswith('diff --git '):
                      flush(pending_left, pending_right, seen_left, seen_right)
                      pending_left = pending_right = None
                      in_header = True
                      old_path = None
                      new_path = None
                      continue
                  if in_header and line.startswith('--- '):
                      old_path = header_path(line, 'a/')
                      continue
                  if in_header and line.startswith('+++ '):
                      new_path = header_path(line, 'b/')
                      for path in (old_path, new_path):
                          if path is not None:
                              changed.setdefault(path, [])
                      continue
                  hunk = HUNK.match(line)
                  if hunk and (old_path is not None or new_path is not None):
                      flush(pending_left, pending_right, seen_left, seen_right)
                      pending_left = pending_right = None
                      seen_left = seen_right = 0
                      in_header = False
                      left = hunk_range(hunk.group(1), hunk.group(2))
                      right = hunk_range(hunk.group(3), hunk.group(4))
                      if old_path is not None and left is not None:
                          changed[old_path].append(left)
                          pending_left = (changed[old_path], left)
                      if new_path is not None and right is not None and (new_path != old_path or right != left):
                          changed[new_path].append(right)
                          pending_right = (changed[new_path], right)
                      elif new_path is not None and right is not None:
                          pending_right = pending_left
                      continue
                  # Only lines actually present in the (possibly truncated) diff extend
                  # what the model could have reviewed; a hunk cut short is clamped.
                  if not in_header and (pending_left is not None or pending_right is not None):
                      if line.startswith('-'):
                          seen_left += 1
                      elif line.startswith('+'):
                          seen_right += 1
                      elif line.startswith(' ') or line == '\n':
                          seen_left += 1
                          seen_right += 1
              flush(pending_left, pending_right, seen_left, seen_right)
              return changed


          def main(argv):
              diff_file, out_file = argv[1:3]
              # newline='\n' keeps a bare carriage return inside added content from
              # terminating a line, so it cannot smuggle a forged file header.
              with open(diff_file, encoding='utf-8', errors='replace', newline='\n') as handle:
                  changed = build_changed_lines(handle)
              with open(out_file, 'w', encoding='utf-8') as handle:
                  json.dump(changed, handle)


          if __name__ == '__main__':
              main(sys.argv)
          PY
          then
            echo "::error title=Changed-line map failed::Could not build the trusted changed-line map; refusing to review without it."
            exit 1
          fi
          echo "changed_lines_file=${CHANGED_LINES_FILE}" >> "$GITHUB_OUTPUT"
          # Opaque entries (binary files, git binary patches) expose no lines the
          # model can inspect or cite, so a diff containing one can never be
          # reviewed in FULL: a zero-finding verdict must stay a PARTIAL comment,
          # never an APPROVE that claims coverage of bytes nobody inspected.
          # Mode-only changes, gitlinks (submodule pointers), 100% renames/copies,
          # binary patches, and paths git could not render as UTF-8 (JSON \ufffd)
          # all leave nothing the model can cite line by line. json.dump writes
          # U+FFFD as the six-character \ufffd escape, not the UTF-8 bytes.
          if grep -qE '^(Binary files .* differ|GIT binary patch|old mode [0-7]+|new mode [0-7]+|(new|deleted) file mode 160000|index [0-9a-f]+\.\.[0-9a-f]+ 160000|similarity index 100%)$' "$VISIBLE_DIFF_FILE" \
              || grep -qF '\ufffd' "$CHANGED_LINES_FILE" \
              || ! python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); sys.exit(0 if any(ranges for ranges in data.values()) else 1)' "$CHANGED_LINES_FILE"; then
            OPAQUE=true
            echo "::warning title=Opaque diff entries::PR diff contains binary, mode-only, gitlink, rename, or otherwise opaque changes; coverage is PARTIAL."
          else
            OPAQUE=false
          fi
          if [ "$BYTES" -gt "$MAXLEN" ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
            TRUNC_NOTE="[NOTE: diff truncated at ${MAXLEN} bytes - coverage is PARTIAL; state that explicitly in the verdict and do not claim full coverage.]"
            DIFF="$(printf '%s\n%s' "$(head -c "$MAXLEN" "$DIFF_FILE")" "$TRUNC_NOTE")"
            echo "::warning title=Diff truncated::PR diff exceeds ${MAXLEN} bytes; inline copy truncated."
          elif [ "$OPAQUE" = "true" ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
            OPAQUE_NOTE="[NOTE: the diff contains binary or otherwise opaque entries that cannot be inspected inline - coverage is PARTIAL; state that explicitly in the verdict and do not claim full coverage.]"
            DIFF="$(printf '%s\n%s' "$(cat "$DIFF_FILE")" "$OPAQUE_NOTE")"
          else
            echo "partial=false" >> "$GITHUB_OUTPUT"
            DIFF="$(cat "$DIFF_FILE")"
          fi
          echo "Changed files:"; printf '%s\n' "$FILES"
          # Randomized heredoc delimiter: untrusted PR content containing a
          # FIXED sentinel could otherwise close the GITHUB_ENV value early and
          # inject env vars into the credentialed step. (Security P2.)
          DELIM="__CR_$(openssl rand -hex 12 2>/dev/null || echo "${RANDOM}${RANDOM}${GITHUB_RUN_ID:-x}")__"
          # Gate has_diff=true on a SUCCESSFUL env export — a partial/failed
          # append must not let the review run on an empty prompt and post a
          # false clean verdict. (CodeRabbit L164.)
          if {
            echo "REVIEW_FILES<<${DELIM}"
            printf '%s\n' "$FILES"
            echo "${DELIM}"
            echo "REVIEW_DIFF<<${DELIM}"
            printf '%s\n' "$DIFF"
            echo "${DELIM}"
          } >> "$GITHUB_ENV"; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Diff export failed::Could not export review diff to GITHUB_ENV; skipping review."
            exit 0
          fi

      # PRIMARY review — jimmygregorio token (CLAUDE_CODE_OAUTH_TOKEN). If this
      # account fails (quota, auth, model, or action failure),
      # the step fails under continue-on-error and the FALLBACK step runs on the
      # berkeley token so reviews don't stop.
      - name: Run Claude Code Review (primary)
        if: >-
          steps.review-workflow.outputs.changed != 'true' &&
          steps.precompute.outputs.has_diff == 'true'
        id: claude-review
        continue-on-error: true
        timeout-minutes: 40
        uses: anthropics/claude-code-action@700e7f8316990de46bed556429765647af760efc # v1.0.176
        env:
          ANTHROPIC_API_KEY: ""
        with:
          settings: |
            {"env": {"API_FORCE_IDLE_TIMEOUT": "1"}}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action receives the job token for PR context only. Claude gets
          # no tools and cannot publish model-authored content directly.
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for trackly-cli — a Node.js CLI and
            MCP server for AI-agent job tracking (search, apply, track). The PR diff is provided INLINE below. You have no repo
            file-reading, Bash/git/Edit/Write/web tools. Review only the inline
            diff; do not claim full coverage if it is truncated. Cite every
            finding with a path and line that appears in the inline diff map.

            Report findings with HIGH RECALL. Surface every genuine issue you see,
            including lower-confidence ones — tag each with a severity label
            instead of silently dropping it. Do NOT self-censor to "only critical"
            issues; the severity tag is how the reader triages. Only skip pure
            formatting/style nits that have no behavioral impact.

            Severity labels:
              🔴 P1 — must fix before merge (bug, security, regression, data loss)
              🟡 P2 — should fix (missing test, risky pattern, perf cliff, fragile logic)
              🟢 P3 — worth considering (clarity, naming, minor edge case)

            Focus areas (priority order):
            1. Correctness / logic bugs (CLI arg parsing, async/await, error
               propagation, exit codes, MCP tool contract mismatches)
            2. Security (credential/token handling, secret leakage in logs/output,
               unsafe shell/exec, path traversal, SSRF via user-supplied URLs)
            3. Data-loss or irreversible-op risk (destructive commands, overwrite
               without confirmation, corrupt local state)
            4. Missing tests for new CLI/MCP behavior
            5. Performance (unbounded pagination, N+1 API calls, large JSON parse)
            6. Docs/skills drift (SKILL.md / MCP tool schemas vs implementation)
            For workflow/config changes, also check that review gates can't
            silently no-op.

            STEP 1 - Build the changed-line map FIRST from the inline diff.
            Map each changed file to its ADDED/CHANGED (right-side, `+`) line
            numbers, and ALSO track DELETED (left-side, `-`) lines so you catch
            regressions introduced by removed code (dropped guards, error
            handling, or cleanup) - a review that only looks at added lines
            misses deletion bugs. EVERY finding record MUST cite a (file,
            line) pair that appears in that map - either an ADDED/CHANGED
            right-side line, or, for a finding about removed code, a DELETED
            left-side line. If the inline diff includes a
            truncation or opaque-entry NOTE, state PARTIAL coverage explicitly and do not claim
            full coverage.

            Changed files:
            ${{ env.REVIEW_FILES }}

            Unified diff (inline copy):
            ```diff
            ${{ env.REVIEW_DIFF }}
            ```

            STEP 2 — End your run with one COMPLETE review as your final text
            message. A trusted downstream step validates and publishes that
            text; you have no commenting or other tools. Begin with this exact
            header line:

            ## 🔵 Claude Code Review

            Then use exactly one standalone counts line, coverage line, and
            recommendation line in these formats:
            `Counts: 🔴 N / 🟡 N / 🟢 N`
            `Coverage: FULL|PARTIAL`
            `Recommendation: APPROVE|REQUEST_CHANGES|COMMENT`
            These must be the first three nonblank lines after the header, in
            that order. After them, include only the required clean-verdict
            line or one `path:line — severity — finding` line per finding. Do
            not wrap terminal records in lists, code blocks, HTML, or prose.
            Use APPROVE only for a full-coverage zero-finding review. Use COMMENT
            for a partial zero-finding review or a P2/P3-only review. Never use
            APPROVE when findings exist, and use REQUEST_CHANGES when any P1
            exists.
            Finding descriptions may use plain text, balanced emphasis, and
            balanced one- or two-backtick inline code. Outside inline code, do
            not include URLs, email addresses, @mentions, repository/issue/commit
            references, links, images, HTML, entities, non-ASCII spacing,
            invisible characters, backslash escapes, severity symbols, GitHub
            emoji shortcodes, or list-marker prefixes. Put a
            necessary literal URL, email, @mention, severity symbol, or emoji
            shortcode inside inline code.
            If there are zero findings
            and the review input carries no PARTIAL coverage NOTE, use exactly:
            `LGTM — no issues found (checked correctness, security, data-loss, tests, performance).`
            If the review input
            contains a NOTE saying `coverage is PARTIAL` (truncated or opaque
            entries), use exactly:
            `Partial LGTM — no issues found in the visible diff (coverage was partial because the diff was truncated).`
            Do not claim full coverage.
          claude_args: |
            --model ${{ env.CLAUDE_REVIEW_MODEL }}
            --fallback-model ${{ env.CLAUDE_REVIEW_FALLBACK_MODEL }}
            # v1.0.176 drops an empty next argument and emits a broken bare
            # --tools. The equals form reaches Claude Code as an empty list.
            --tools=

      # FALLBACK review — berkeley token (CLAUDE_CODE_OAUTH_TOKEN_FALLBACK). Runs
      # ONLY when the primary step did not succeed (e.g. jimmy hit its session
      # limit). Identical config, different account = a second auth path so a
      # primary failure doesn't leave the PR unreviewed.
      - name: Run Claude Code Review (fallback)
        if: >-
          steps.review-workflow.outputs.changed != 'true' &&
          steps.precompute.outputs.has_diff == 'true' &&
          steps.claude-review.outcome != 'success'
        id: claude-review-fallback
        continue-on-error: true
        timeout-minutes: 40
        uses: anthropics/claude-code-action@700e7f8316990de46bed556429765647af760efc # v1.0.176
        env:
          ANTHROPIC_API_KEY: ""
        with:
          settings: |
            {"env": {"API_FORCE_IDLE_TIMEOUT": "1"}}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for trackly-cli — a Node.js CLI and
            MCP server for AI-agent job tracking (search, apply, track). The PR diff is provided INLINE below. You have no repo
            file-reading, Bash/git/Edit/Write/web tools. Review only the inline
            diff; do not claim full coverage if it is truncated. Cite every
            finding with a path and line that appears in the inline diff map.

            Report findings with HIGH RECALL. Surface every genuine issue you see,
            including lower-confidence ones — tag each with a severity label
            instead of silently dropping it. Do NOT self-censor to "only critical"
            issues; the severity tag is how the reader triages. Only skip pure
            formatting/style nits that have no behavioral impact.

            Severity labels:
              🔴 P1 — must fix before merge (bug, security, regression, data loss)
              🟡 P2 — should fix (missing test, risky pattern, perf cliff, fragile logic)
              🟢 P3 — worth considering (clarity, naming, minor edge case)

            Focus areas (priority order):
            1. Correctness / logic bugs (CLI arg parsing, async/await, error
               propagation, exit codes, MCP tool contract mismatches)
            2. Security (credential/token handling, secret leakage in logs/output,
               unsafe shell/exec, path traversal, SSRF via user-supplied URLs)
            3. Data-loss or irreversible-op risk (destructive commands, overwrite
               without confirmation, corrupt local state)
            4. Missing tests for new CLI/MCP behavior
            5. Performance (unbounded pagination, N+1 API calls, large JSON parse)
            6. Docs/skills drift (SKILL.md / MCP tool schemas vs implementation)
            For workflow/config changes, also check that review gates can't
            silently no-op.

            STEP 1 - Build the changed-line map FIRST from the inline diff.
            Map each changed file to its ADDED/CHANGED (right-side, `+`) line
            numbers, and ALSO track DELETED (left-side, `-`) lines so you catch
            regressions introduced by removed code (dropped guards, error
            handling, or cleanup) - a review that only looks at added lines
            misses deletion bugs. EVERY finding record MUST cite a (file,
            line) pair that appears in that map - either an ADDED/CHANGED
            right-side line, or, for a finding about removed code, a DELETED
            left-side line. If the inline diff includes a
            truncation or opaque-entry NOTE, state PARTIAL coverage explicitly and do not claim
            full coverage.

            Changed files:
            ${{ env.REVIEW_FILES }}

            Unified diff (inline copy):
            ```diff
            ${{ env.REVIEW_DIFF }}
            ```

            STEP 2 — End your run with one COMPLETE review as your final text
            message. A trusted downstream step validates and publishes that
            text; you have no commenting or other tools. Begin with this exact
            header line:

            ## 🔵 Claude Code Review

            Then use exactly one standalone counts line, coverage line, and
            recommendation line in these formats:
            `Counts: 🔴 N / 🟡 N / 🟢 N`
            `Coverage: FULL|PARTIAL`
            `Recommendation: APPROVE|REQUEST_CHANGES|COMMENT`
            These must be the first three nonblank lines after the header, in
            that order. After them, include only the required clean-verdict
            line or one `path:line — severity — finding` line per finding. Do
            not wrap terminal records in lists, code blocks, HTML, or prose.
            Use APPROVE only for a full-coverage zero-finding review. Use COMMENT
            for a partial zero-finding review or a P2/P3-only review. Never use
            APPROVE when findings exist, and use REQUEST_CHANGES when any P1
            exists.
            Finding descriptions may use plain text, balanced emphasis, and
            balanced one- or two-backtick inline code. Outside inline code, do
            not include URLs, email addresses, @mentions, repository/issue/commit
            references, links, images, HTML, entities, non-ASCII spacing,
            invisible characters, backslash escapes, severity symbols, GitHub
            emoji shortcodes, or list-marker prefixes. Put a
            necessary literal URL, email, @mention, severity symbol, or emoji
            shortcode inside inline code.
            If there are zero findings
            and the review input carries no PARTIAL coverage NOTE, use exactly:
            `LGTM — no issues found (checked correctness, security, data-loss, tests, performance).`
            If the review input
            contains a NOTE saying `coverage is PARTIAL` (truncated or opaque
            entries), use exactly:
            `Partial LGTM — no issues found in the visible diff (coverage was partial because the diff was truncated).`
            Do not claim full coverage.
          claude_args: |
            --model ${{ env.CLAUDE_REVIEW_FALLBACK_MODEL }}
            # Keep the equals form; the pinned action drops quoted empties.
            --tools=

      # Detectability backstop (logs): classify the outcome so a silent
      # no-review is visible in the run summary. Distinguishes precompute-miss
      # from token-failure so the message is never misleading. (Reliability.)
      - name: Report Claude review status
        if: always() && steps.review-workflow.outputs.changed != 'true'
        shell: bash
        run: |
          if [ "${{ steps.precompute.outputs.has_diff }}" != "true" ]; then
            echo "::warning title=Claude review skipped::No diff computed (precompute outcome=${{ steps.precompute.outcome }}); no review attempted."
            exit 1
          elif [ "${{ steps.claude-review.outcome }}" = "success" ]; then
            echo "Claude review posted via the primary (jimmygregorio) token."
          elif [ "${{ steps.claude-review-fallback.outcome }}" = "success" ]; then
            echo "::notice title=Claude review used fallback::Primary failed (${{ steps.claude-review.outcome }}); posted via the berkeley fallback token."
          else
            echo "::warning title=Claude review did not post::Both workflow auth attempts failed (primary=${{ steps.claude-review.outcome }}, fallback=${{ steps.claude-review-fallback.outcome }}). Inspect action logs for OAuth token, usage/quota, model availability, or action config. The step now fails loudly on a turn-1 SDK error (v1.0.176), so this is a real failure, not a masked one."
            exit 1
          fi

      # A run-log ::warning:: does NOT surface on the PR conversation, so a
      # no-review run reads as a green "reviewed clean" check. When review could
      # not run, post a VISIBLE PR comment so the empty result is
      # never mistaken for an approval. (Adversarial + Security.) Uses the job's
      # own github_token via the REST API (no gh dependency); python3 for safe
      # JSON encoding. Never fails the job.
      - name: Post PR notice if review could not run
        if: >-
          always() && steps.review-workflow.outputs.changed != 'true' &&
          steps.claude-review.outcome != 'success' &&
          steps.claude-review-fallback.outcome != 'success'
        shell: bash
        env:
          GH_TOKEN_POST: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ "${{ steps.precompute.outputs.has_diff }}" != "true" ]; then
            REASON="the PR diff could not be computed"
          else
            REASON="both workflow auth attempts failed"
          fi
          BODY="## 🔵 Claude Code Review"$'\n\n'"⚠️ Automated review could not run at head \`${HEAD_SHA}\` ([run](${RUN_URL})) - ${REASON}. This check fails closed; it is NOT an approval and NOT a clean result. If review auth failed, inspect action logs for OAuth token, usage/quota, model availability, or action config before relying on this gate."
          python3 -c 'import json,sys;print(json.dumps({"body":sys.argv[1]}))' "$BODY" > "$RUNNER_TEMP/cr_notice.json" || { echo "::warning::could not build notice body"; exit 0; }
          curl -sS --fail -X POST \
            -H "Authorization: Bearer ${GH_TOKEN_POST}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @"$RUNNER_TEMP/cr_notice.json" >/dev/null \
            && echo "Posted review-unavailable notice to PR." \
            || echo "::warning::Failed to post review-unavailable notice to the PR."

      # Terminal publication boundary: recover the final review from this exact
      # action execution, validate it with protected-base code, and only then
      # publish it. Invalid or missing output posts a visible failure notice.
      - name: Publish validated exact-run terminal review
        if: >-
          always() && steps.review-workflow.outputs.changed != 'true' &&
          (steps.claude-review.outcome == 'success' ||
           steps.claude-review-fallback.outcome == 'success')
        shell: bash
        env:
          GH_TOKEN_POST: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXEC_FILE_PRIMARY: ${{ steps.claude-review.outputs.execution_file }}
          EXEC_FILE_FALLBACK: ${{ steps.claude-review-fallback.outputs.execution_file }}
          PARTIAL_COVERAGE: ${{ steps.precompute.outputs.partial }}
          CHANGED_LINES_FILE: ${{ steps.precompute.outputs.changed_lines_file }}
        run: |
          set -uo pipefail
          # Publish the terminal text from this exact execution. This is the
          # only model-authored review content allowed onto the PR. The trusted
          # extractor isolates the last header-led terminal record and unwraps
          # one taught inline-code pair on metadata and clean-verdict lines;
          # autolinks, trailing prose, and incomplete last results still fail
          # closed.
          if [ -z "${CHANGED_LINES_FILE:-}" ] || [ ! -s "$CHANGED_LINES_FILE" ]; then
            echo "::error::Trusted changed-line map is missing; every finding location must be validated against the reviewed diff."
            exit 1
          fi
          if [ "${{ steps.claude-review.outcome }}" = "success" ]; then
            EXEC_FILE="$EXEC_FILE_PRIMARY"
          else
            EXEC_FILE="$EXEC_FILE_FALLBACK"
          fi
          REVIEW_TEXT=""
          case "$PARTIAL_COVERAGE" in
            true) COVERAGE_FLAG="--partial" ;;
            false) COVERAGE_FLAG="--full" ;;
            *) echo "::error::Trusted diff-coverage state is missing or invalid."; exit 1 ;;
          esac
          TRUSTED_EXTRACTOR_JSON="$RUNNER_TEMP/trusted-claude-review-extractor.json"
          TRUSTED_EXTRACTOR="$RUNNER_TEMP/extract-terminal-claude-review.js"
          if ! curl -sS --fail \
              -H "Authorization: Bearer ${GH_TOKEN_POST}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/scripts/extract-terminal-claude-review.js?ref=${BASE_SHA}" \
              > "$TRUSTED_EXTRACTOR_JSON"; then
            echo "::error::Could not load the Claude review extractor from trusted base ${BASE_SHA}."
            exit 1
          elif ! python3 -c 'import base64,json,sys;print(base64.b64decode(json.load(open(sys.argv[1]))["content"]).decode(),end="")' \
              "$TRUSTED_EXTRACTOR_JSON" > "$TRUSTED_EXTRACTOR"; then
            echo "::error::Could not decode the trusted Claude review extractor."
            exit 1
          elif ! grep -q 'function loadChangedLines' "$TRUSTED_EXTRACTOR"; then
            echo "::error::Trusted base extractor does not validate finding locations; refusing to publish an unvalidated record."
            exit 1
          elif [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ] \
              && REVIEW_TEXT="$(node "$TRUSTED_EXTRACTOR" "$EXEC_FILE" "$COVERAGE_FLAG" "$CHANGED_LINES_FILE")"; then
            REVIEW_BYTES="$(printf '%s' "$REVIEW_TEXT" | wc -c | tr -d '[:space:]')"
            if ! [[ "$REVIEW_BYTES" =~ ^[0-9]+$ ]] || [ "$REVIEW_BYTES" -gt 60000 ]; then
              echo "::error title=Oversized review::The complete terminal review exceeds the safe GitHub comment limit; refusing to truncate findings."
              exit 1
            fi
            NOTE="_(exact-run terminal record for head \`${HEAD_SHA}\`; [workflow run](${RUN_URL}).)_"
            case "$REVIEW_TEXT" in
              "## 🔵 Claude Code Review"*) BODY="$REVIEW_TEXT"$'\n\n'"$NOTE" ;;
              *) BODY="## 🔵 Claude Code Review"$'\n\n'"$NOTE"$'\n\n'"$REVIEW_TEXT" ;;
            esac
            python3 -c 'import json,sys;print(json.dumps({"body":sys.argv[1]}))' "$BODY" > "$RUNNER_TEMP/cr_backstop.json" || { echo "::error::could not build backstop body"; exit 1; }
            if curl -sS --fail -X POST \
                -H "Authorization: Bearer ${GH_TOKEN_POST}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                -d @"$RUNNER_TEMP/cr_backstop.json" >/dev/null; then
              echo "Posted the exact-run terminal review record."
            else
              echo "::error::Failed to post backstop review comment."
              exit 1
            fi
          else
            echo "::error title=Incomplete review::A review step succeeded but lacked the required valid terminal verdict; inline comments are insufficient review coverage."
            BODY="## 🔵 Claude Code Review"$'\n\n'"⚠️ The review ran at head \`${HEAD_SHA}\` ([run](${RUN_URL})) but lacked a valid terminal verdict. This check fails closed; inline comments and intermediate planning text are insufficient review coverage. Re-run the review or use the documented exact-head compensating review path."
            python3 -c 'import json,sys;print(json.dumps({"body":sys.argv[1]}))' "$BODY" > "$RUNNER_TEMP/cr_empty.json" || exit 1
            if curl -sS --fail -X POST \
                -H "Authorization: Bearer ${GH_TOKEN_POST}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                -d @"$RUNNER_TEMP/cr_empty.json" >/dev/null; then
              echo "Posted incomplete-review notice to PR."
            else
              echo "::warning::Failed to post incomplete-review notice to the PR."
            fi
            exit 1
          fi
